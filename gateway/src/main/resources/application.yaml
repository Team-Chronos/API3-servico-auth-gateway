  spring:
  application:
    name: auth-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Requested-With
              - Accept
              - Origin
              - Access-Control-Request-Method
              - Access-Control-Request-Headers
            exposedHeaders:
              - Authorization
              - X-User-Id
              - X-Username
              - X-User-Roles
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: controle-horas
          uri: http://controle-horas:8082
          predicates:
            - Path=/apontamento/**
            - Method=POST,PUT,DELETE,PATCH
          filters:
            - StripPrefix=1

        - id: ms-profissionais
          uri: http://ms-profissionais:8081
          predicates:
            - Path=/profissionais/**
          filters:
            - StripPrefix=1

        - id: projeto
          uri: http://projeto:8084
          predicates:
            - Path=/projeto/**
          filters:
            - StripPrefix=1

        - id: financeiro
          uri: http://financeiro:8085
          predicates:
            - Path=/financeiro/**
          filters:
            - StripPrefix=1

        - id: tarefas-api
          uri: http://tarefas-api:8089
          predicates:
            - Path=/tarefas/**
            - Method=POST,PUT,DELETE,PATCH
          filters:
            - StripPrefix=1

        - id: tipo-tarefa-api
          uri: http://tarefas-api:8089
          predicates:
            - Path=/tipoTarefa/**
            - Method=POST,PUT,DELETE,PATCH

        - id: itens-api
          uri: http://tarefas-api:8089
          predicates:
            - Path=/itens/**
            - Method=POST,PUT,DELETE,PATCH

        - id: tarefas-get-api
          uri: http://tarefas-get-api:8099
          predicates:
            - Path=/tarefas/**
            - Method=GET
          filters:
            - StripPrefix=1

        - id: tipo-tarefa-get-api
          uri: http://tarefas-get-api:8099
          predicates:
            - Path=/tipoTarefa/**
            - Method=GET

        - id: itens-get-api
          uri: http://tarefas-get-api:8099
          predicates:
            - Path=/itens/**
            - Method=GET

        - id: apontamento-get-api
          uri: http://apontamento-get-api:8092
          predicates:
            - Path=/apontamento/**
            - Method=GET

        - id: login-api
          uri: http://login-api:8083
          predicates:
            - Path=/login/**
            
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s

jwt:
  secret: rnssz0A37Cdr7Cw89GZowLRpSWVLuOliGAC0sy+gDZzvL9Xk3OPn4fp3CZcufV75
  expiration: 86400000

auth:
  public-paths:
    - /login/**
    - /login
    - /auth/**
    - /public/**
    - /actuator/health
  rate-limits:
    per-token: 100
    per-ip: 200
  rules:
    - path: /financeiro/**
      methods: [GET, POST, PUT, DELETE, PATCH]
      roles: [ROLE_FINANCE]

    - path: /projeto/**
      methods: [GET, POST, PUT, DELETE, PATCH]
      roles: [ROLE_FINANCE, ROLE_GERENTE_PROJETO, ROLE_USER]

    - path: /profissionais/**
      methods: [GET]
      roles: [ROLE_FINANCE, ROLE_GERENTE_PROJETO, ROLE_USER]

    - path: /profissionais/**
      methods: [POST, PUT, DELETE, PATCH]
      roles: [ROLE_FINANCE, ROLE_GERENTE_PROJETO]

    - path: /tarefas/**
      methods: [GET, POST, PUT, DELETE, PATCH]
      roles: [ROLE_FINANCE, ROLE_GERENTE_PROJETO, ROLE_USER]

    - path: /tipoTarefa/**
      methods: [GET, POST, PUT, DELETE, PATCH]
      roles: [ROLE_FINANCE, ROLE_GERENTE_PROJETO, ROLE_USER]

    - path: /itens/**
      methods: [GET, POST, PUT, DELETE, PATCH]
      roles: [ROLE_FINANCE, ROLE_GERENTE_PROJETO, ROLE_USER]

    - path: /apontamento/**
      methods: [GET, POST, PUT, DELETE, PATCH]
      roles: [ROLE_FINANCE, ROLE_GERENTE_PROJETO, ROLE_USER]

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.api.gateway: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: DEBUG